name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - feature-1-added-all-components-and-details-contents
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          PUBLIC_URL: https://UCodeCrafter.github.io/uttam-resume-app

      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
